services:

  # NATS Server for messaging
  nats-server:
    container_name: nats-server
    image: nats:2.14-alpine
    restart: unless-stopped
    ports:
      - "4222:4222"  # NATS client port
      - "8222:8222"  # NATS monitoring port
    environment:
      # NATS Authentication (optional)
      - NATS_USER=${NATS_USER:-}
      - NATS_PASSWORD=${NATS_PASSWORD:-}
      - NATS_TOKEN=${NATS_TOKEN:-}
      # NATS TLS (optional)
      - NATS_ENABLE_TLS=${NATS_ENABLE_TLS:-false}
    command: >
      sh -c "
        CMD='-js -m 8222 -sd /data';
        if [ -n \"$${NATS_TOKEN}\" ]; then
          CMD=\"$${CMD} --auth $${NATS_TOKEN}\";
        elif [ -n \"$${NATS_USER}\" ] && [ -n \"$${NATS_PASSWORD}\" ]; then
          CMD=\"$${CMD} --user $${NATS_USER} --pass $${NATS_PASSWORD}\";
        fi;
        if [ \"$${NATS_ENABLE_TLS}\" = \"true\" ]; then
          CMD=\"$${CMD} --tls --tlscert /etc/nats/certs_nats/server.crt --tlskey /etc/nats/certs_nats/server.key\";
        fi;
        exec nats-server $${CMD}
      "
    volumes:
      - nats-data:/data
      - ./certs_nats:/etc/nats/certs_nats:ro
    networks:
      - l2_network
    healthcheck:
      # Real readiness check: probe the monitoring /healthz endpoint instead of
      # just checking that the nats-server binary exists. 200 OK only when the
      # server is accepting connections (503/refused in lame-duck or while down).
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # NATS Exporter for Prometheus metrics
  nats-exporter:
    container_name: nats-exporter
    image: natsio/prometheus-nats-exporter:0.20.0
    restart: unless-stopped
    ports:
      - "7778:7777"  # NATS exporter metrics port (7777 inside container, 7778 on host)
    command:
      - "-varz"
      - "-connz"
      - "-subz"
      - "http://nats-server:8222"
    depends_on:
      - nats-server
    networks:
      - l2_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7777/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nats-gui:
    container_name: nats-gui
    image: docker-registry.dp.nlmk.com/sphqxe/nats-webui:latest
    restart: unless-stopped
    ports:
      - "7779:80"
    depends_on:
      - nats-server
#    volumes:
#      - ./nats-webui/sqlite.db:/usr/local/bin/nats/sqlite.db
    networks:
      - l2_network
    profiles:
      - nostart

  jaeger:
    container_name: jaeger
    image: jaegertracing/jaeger:2.15.1
    restart: unless-stopped
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # Jaeger HTTP collector
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "9411:9411"    # Zipkin
      - "5778:5778"    # Config
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - l2_network
#    profiles:
#      - nostart

  # VictoriaMetrics - Prometheus-compatible metrics storage (lighter than Prometheus)
  victoria-metrics:
    container_name: victoria-metrics
    image: victoriametrics/victoria-metrics:v1.97.0
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    command:
      - '--httpListenAddr=:8428'
      - '--storageDataPath=/victoria-metrics-data'
      - '--retentionPeriod=15d'
      - '--search.maxQueryLen=1048576'
    networks:
      - l2_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8428/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # VictoriaMetrics Agent - scrapes metrics from services
  vmagent:
    container_name: vmagent
    image: victoriametrics/vmagent:v1.97.0
    restart: unless-stopped
    ports:
      - "8429:8429"
    volumes:
      - ./prometheus/vmagent-scrape.yml:/etc/vmagent/prometheus.yml:ro
      - vmagent-data:/tmp/vmagent-remotewrite
    command:
      - '--promscrape.config=/etc/vmagent/prometheus.yml'
      - '--remoteWrite.url=http://victoria-metrics:8428/api/v1/write'
      - '--httpListenAddr=:8429'
      - '--promscrape.streamParse=true'
    environment:
      - VM_NAME=${VM_NAME:-hostname}
    networks:
      - l2_network
    depends_on:
      - victoria-metrics
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8429/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  l2-server:
    container_name: l2-server
    image: http-redis-proxy-l2-proxy:latest
    restart: unless-stopped
    mem_limit: ${L2_SERVER_MEM_LIMIT:-1g}
    ports:
      - "3333:8088"
      - "19092:19092"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker-memory-analysis:/memory-logs
      - ./crash-dumps:/crash-dumps
    environment:
      - MODE=l2-server
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - L2_SERVER_PROTOCOL=http
      - L2_SERVER_HOST=l2-server
      - L2_SERVER_PORT=8088
      # Test-only: random response delay in ms (0 = disabled). Desynchronizes
      # response order for the response-to-request correlation test.
      - L2_TEST_RESPONSE_DELAY_MS=${L2_TEST_RESPONSE_DELAY_MS:-0}
      - JAEGER_URL=http://jaeger:9411/api/v2/spans
      - THREAD_POOL_TYPE=custom
      - ENABLE_TRACING=true
      - ENABLE_SSL_SERVER_CERTIFICATE_VERIFICATION=false
      - ENABLE_SSL_SERVER_HOSTNAME_VERIFICATION=false
      - HTTP_POOL_SIZE=200
      - HTTP_TIMEOUT_SECONDS=300
      # Tracing tuning
      - TRACING_BATCH_SIZE=${TRACING_BATCH_SIZE:-50}
      - TRACING_FLUSH_INTERVAL_MS=${TRACING_FLUSH_INTERVAL_MS:-1000}
      - TRACING_SAMPLE_RATE=${TRACING_SAMPLE_RATE:-1.0}
      # Crash test diagnostic (raises SIGSEGV on startup)
      - CRASH_TEST=${CRASH_TEST:-false}
      # HTTP /crash-test endpoint (default off; only for test-crash-handler.py)
      - ENABLE_CRASH_TEST_ENDPOINT=${ENABLE_CRASH_TEST_ENDPOINT:-false}
      # /health/ready may initiate a blocking NATS reconnect (default off)
      - HEALTH_READY_ALLOW_CONNECT=${HEALTH_READY_ALLOW_CONNECT:-false}
      # HTTPS server SSL configuration (optional)
      - SSL_SERVER_CERT_FILE=${SSL_SERVER_CERT_FILE:-}
      - SSL_SERVER_KEY_FILE=${SSL_SERVER_KEY_FILE:-}
      - ASAN_OPTIONS=${ASAN_OPTIONS:-detect_leaks=1:halt_on_error=0:log_path=/memory-logs/l2-server-asan:ubsan_options=print_stacktrace=1}
      - LSAN_OPTIONS=${LSAN_OPTIONS:-report_objects=1}
      - UBSAN_OPTIONS=${UBSAN_OPTIONS:-print_stacktrace=1:halt_on_error=0}
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "--max-time", "5", "http://localhost:19092/metrics"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - l2_network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
#    profiles:
#      - nostart


  l2-test:
    container_name: l2-test
    image: curlimages/curl:latest
#    depends_on:
#      - l2-server
    networks:
      - l2_network
    command: >
      sh -c "
        echo 'Ожидание запуска l2-server...' &&
        sleep 5 &&
        echo 'Отправка тестового запроса...' &&
        curl -v --request POST -H 'Content-Type: application/json' -d '{\"value\": 1}' http://l2-server:8088/
      "
    profiles:
      - nostart

  # Oracle XE 21c for the HTTP DB gateway (l2-worker connects via ODPI-C).
  # First boot initializes the database (takes ~1-3 min); the worker retries
  # its DB subscription until the healthcheck turns green, so the rest of the
  # stack is unaffected while it starts up.
  oracle:
    container_name: oracle
    image: gvenzl/oracle-xe:21.3.0-slim
    restart: unless-stopped
    # Started only on demand: `docker compose --profile oracle up -d`
    profiles:
      - oracle
    mem_limit: ${ORACLE_MEM_LIMIT:-2g}
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-oracle_password}
      - APP_USER=${ORACLE_APP_USER:-app_user}
      - APP_USER_PASSWORD=${ORACLE_APP_PASSWORD:-app_password}
      - ORACLE_CHARACTERSET=${ORACLE_CHARACTERSET:-AL32UTF8}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - l2_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/healthcheck.sh > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # PostgreSQL 16 for the HTTP DB gateway (l2-worker connects via libpq).
  # init scripts run on the first boot via /docker-entrypoint-initdb.d.
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app_password}
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init-postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - l2_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Swagger UI for the HTTP DB gateway API (docs/openapi/http-db-gate.yaml).
  # Serves the spec at http://localhost:8081/http-db-gate.yaml and renders the
  # interactive documentation on the root page.
  swagger-ui:
    container_name: swagger-ui
    image: swaggerapi/swagger-ui:v5.17.14
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # Path (inside the container) where the spec file is mounted. The
      # entrypoint symlinks it into the nginx root and points the UI at it.
      - SWAGGER_JSON=/tmp/http-db-gate.yaml
    volumes:
      - ./docs/openapi/http-db-gate.yaml:/tmp/http-db-gate.yaml:ro
    networks:
      - l2_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  l2-proxy:
    container_name: l2-proxy
    build:
      context: ./cpp/l2-proxy
      dockerfile: Dockerfile
      target: ${L2_PROXY_DOCKER_TARGET:-runtime}
      args:
        BASE_IMAGE: "${BASE_IMAGE:-ubuntu:26.04}"
        APT_MIRROR: "${APT_MIRROR:-}"
        ENABLE_ASAN: "${ENABLE_ASAN:-false}"
        ENABLE_PROFILER: "${ENABLE_PROFILER:-false}"
        CACHE_BUST: "${CACHE_BUST:-1}"
    restart: unless-stopped
    mem_limit: ${L2_PROXY_MEM_LIMIT:-1g}
    ports:
      - "8888:8888"
      - "19090:19090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker-memory-analysis:/memory-logs
      - ./certs_nats:/etc/nats/certs_nats:ro
      - ./crash-dumps:/crash-dumps
    environment:
      - PROXY_PORT=8888
      - PROXY_PROTOCOL=http
      - MODE=proxy
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - THREAD_POOL_TYPE=custom
      - HTTP_POOL_SIZE=${HTTP_POOL_SIZE:-100}
      - REQUEST_TIMEOUT_SECONDS=30
      - HTTP_TIMEOUT_SECONDS=10
      - JAEGER_URL=http://jaeger:9411/api/v2/spans
      - ENABLE_TRACING=true
      # NATS Configuration
      - NATS_HOST=${NATS_HOST:-nats-server}
      - NATS_PORT=${NATS_PORT:-4222}
      - NATS_SUBJECT=${NATS_SUBJECT:-service.proxy}
      - NATS_QUEUE_GROUP=${NATS_QUEUE_GROUP:-proxy_workers}
      - NATS_TIMEOUT_MS=${NATS_TIMEOUT_MS:-30000}
      # NATS Authentication (optional)
      - NATS_USERNAME=${NATS_USERNAME:-}
      - NATS_PASSWORD=${NATS_PASSWORD:-}
      - NATS_TOKEN=${NATS_TOKEN:-}
      - NATS_CREDENTIALS_FILE=${NATS_CREDENTIALS_FILE:-}
      # NATS TLS (optional)
      - NATS_ENABLE_TLS=${NATS_ENABLE_TLS:-false}
      - NATS_TLS_CERT_FILE=${NATS_TLS_CERT_FILE:-}
      - NATS_TLS_KEY_FILE=${NATS_TLS_KEY_FILE:-}
      - NATS_TLS_CA_CERT_FILE=${NATS_TLS_CA_CERT_FILE:-}
      # HTTP DB gateway (route /v1/sql/* to the DB worker over NATS). The proxy
      # only registers the database config for routing/validation; the worker
      # holds the driver connection pools (runtime-db image).
      - DB_QUERY_ENABLED=${DB_QUERY_ENABLED:-true}
      - DB_QUERY_NATS_SUBJECT=${DB_QUERY_NATS_SUBJECT:-service.db.query}
      - DB_QUERY_NATS_QUEUE_GROUP=${DB_QUERY_NATS_QUEUE_GROUP:-db_workers}
      - DB_QUERY_NATS_TIMEOUT_MS=${DB_QUERY_NATS_TIMEOUT_MS:-30000}
      - DB_QUERY_DEFAULT_TIMEOUT_MS=${DB_QUERY_DEFAULT_TIMEOUT_MS:-5000}
      - DB_QUERY_DEFAULT_MAX_ROWS=${DB_QUERY_DEFAULT_MAX_ROWS:-1000}
      - DB_ORACLE_ENABLED=${DB_ORACLE_ENABLED:-false}
      - DB_ORACLE_HOST=${DB_ORACLE_HOST:-oracle}
      - DB_ORACLE_PORT=${DB_ORACLE_PORT:-1521}
      - DB_ORACLE_SERVICE=${DB_ORACLE_SERVICE:-XEPDB1}
      - DB_ORACLE_USER=${DB_ORACLE_USER:-app_user}
      - DB_ORACLE_PASSWORD=${DB_ORACLE_PASSWORD:-app_password}
      - DB_ORACLE_POOL_MIN=${DB_ORACLE_POOL_MIN:-1}
      - DB_ORACLE_POOL_MAX=${DB_ORACLE_POOL_MAX:-5}
      - DB_POSTGRES_ENABLED=${DB_POSTGRES_ENABLED:-true}
      - DB_POSTGRES_HOST=${DB_POSTGRES_HOST:-postgres}
      - DB_POSTGRES_PORT=${DB_POSTGRES_PORT:-5432}
      - DB_POSTGRES_DB=${DB_POSTGRES_DB:-app_db}
      - DB_POSTGRES_USER=${DB_POSTGRES_USER:-app_user}
      - DB_POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD:-app_password}
      - DB_POSTGRES_POOL_MIN=${DB_POSTGRES_POOL_MIN:-1}
      - DB_POSTGRES_POOL_MAX=${DB_POSTGRES_POOL_MAX:-5}
      # Per-IP rate limiting (включено по умолчанию; занизь лимиты через
      # env для trip-теста, см. docker-compose.ratelimit.yml)
      - ENABLE_PER_IP_RATE_LIMITING=${ENABLE_PER_IP_RATE_LIMITING:-true}
      # Per-IP rate limiting tuning (only when ENABLE_PER_IP_RATE_LIMITING=true)
      - PER_IP_MAX_TOKENS=${PER_IP_MAX_TOKENS:-10000}
      - PER_IP_REFILL_RATE=${PER_IP_REFILL_RATE:-1000}
      - PER_IP_MAX_IPS=${PER_IP_MAX_IPS:-10000}
      - PER_IP_CLEANUP_TTL_SECONDS=${PER_IP_CLEANUP_TTL_SECONDS:-300}
      # Global rate limiting (all proxy requests; disable for load testing)
      - ENABLE_GLOBAL_RATE_LIMITING=${ENABLE_GLOBAL_RATE_LIMITING:-true}
      - GLOBAL_RATE_LIMIT_MAX_TOKENS=${GLOBAL_RATE_LIMIT_MAX_TOKENS:-10000}
      - GLOBAL_RATE_LIMIT_REFILL_RATE=${GLOBAL_RATE_LIMIT_REFILL_RATE:-1000}
      # Duplicate POST detection (report on GET /debug/duplicates)
      - DUPLICATE_DETECTION_ENABLED=${DUPLICATE_DETECTION_ENABLED:-true}
      - DUPLICATE_DETECTION_TOP_N=${DUPLICATE_DETECTION_TOP_N:-100}
      - DUPLICATE_DETECTION_MAX_ENTRIES=${DUPLICATE_DETECTION_MAX_ENTRIES:-1000}
      - DUPLICATE_DETECTION_MAX_BODY_BYTES=${DUPLICATE_DETECTION_MAX_BODY_BYTES:-500}
      - DUPLICATE_DETECTION_TTL_MS=${DUPLICATE_DETECTION_TTL_MS:-60000}
      # Reject (HTTP 409) a duplicate POST body within the detector TTL instead
      # of forwarding it (default false: only count/log duplicates)
      - DUPLICATE_REJECT_ENABLED=${DUPLICATE_REJECT_ENABLED:-false}
      # Tracing tuning
      - TRACING_BATCH_SIZE=${TRACING_BATCH_SIZE:-50}
      - TRACING_FLUSH_INTERVAL_MS=${TRACING_FLUSH_INTERVAL_MS:-1000}
      - TRACING_SAMPLE_RATE=${TRACING_SAMPLE_RATE:-1.0}
      # Crash test diagnostic (raises SIGSEGV on startup)
      - CRASH_TEST=${CRASH_TEST:-false}
      # HTTP /crash-test endpoint (default off; only for test-crash-handler.py)
      - ENABLE_CRASH_TEST_ENDPOINT=${ENABLE_CRASH_TEST_ENDPOINT:-false}
      # /health/ready may initiate a blocking NATS reconnect (default off)
      - HEALTH_READY_ALLOW_CONNECT=${HEALTH_READY_ALLOW_CONNECT:-false}
      # HTTPS server SSL configuration (optional)
      - SSL_SERVER_CERT_FILE=${SSL_SERVER_CERT_FILE:-}
      - SSL_SERVER_KEY_FILE=${SSL_SERVER_KEY_FILE:-}
      - ASAN_OPTIONS=${ASAN_OPTIONS:-detect_leaks=1:halt_on_error=0:log_path=/memory-logs/l2-proxy-asan:ubsan_options=print_stacktrace=1}
      - LSAN_OPTIONS=${LSAN_OPTIONS:-report_objects=1}
      - UBSAN_OPTIONS=${UBSAN_OPTIONS:-print_stacktrace=1:halt_on_error=0}
    networks:
      - l2_network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "--max-time", "5", "http://localhost:8888/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      nats-server:
        condition: service_healthy

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "7777:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - l2-proxy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - l2_network

  # Nginx metrics exporter for Prometheus
  nginx-exporter:
    container_name: nginx-exporter
    image: nginx/nginx-prometheus-exporter:1.1
    restart: unless-stopped
    ports:
      - "9113:9113"
    environment:
      - SCRAPE_URI=http://nginx/metrics
    depends_on:
      - nginx
    networks:
      - l2_network
#    profiles:
#      - nostart

  l2-worker:
    container_name: l2-worker
    build:
      context: ./cpp/l2-proxy
      dockerfile: Dockerfile
      target: ${L2_WORKER_DOCKER_TARGET:-runtime-db}
      args:
        BASE_IMAGE: "${BASE_IMAGE:-ubuntu:26.04}"
        APT_MIRROR: "${APT_MIRROR:-}"
        ENABLE_ASAN: "${ENABLE_ASAN:-false}"
        ENABLE_PROFILER: "${ENABLE_PROFILER:-false}"
        CACHE_BUST: "${CACHE_BUST:-1}"
    restart: unless-stopped
    mem_limit: ${L2_WORKER_MEM_LIMIT:-1g}
    ports:
      - "19091:19091"
      - "19093:19093"
#    depends_on:
#      - l2-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./ca-bundle.crt
        target: /root/ca-bundle.crt
        read_only: true
        bind:
          create_host_path: false
      - ./docker-memory-analysis:/memory-logs
      - ./certs_nats:/etc/nats/certs_nats:ro
      - ./crash-dumps:/crash-dumps
    environment:
      - MODE=worker
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      # Optimized timeouts for faster failure detection
      - HTTP_POOL_SIZE=${HTTP_POOL_SIZE:-128}
      - HTTP_POOL_IDLE_TIMEOUT_SECONDS=${HTTP_POOL_IDLE_TIMEOUT_SECONDS:-300}
      - L2_SERVER_URLS=["http://l2-server:8088/"]
      - HTTP_TIMEOUT_SECONDS=10
      - L2_WORKER_THREADS=${L2_WORKER_THREADS:-128}
      - L2_WORKER_QUEUE_SIZE=${L2_WORKER_QUEUE_SIZE:-0}
      - MAX_RETRIES=1
      # Dedup cache for duplicate NATS requests (DEDUP_ENABLED=false disables it)
      - DEDUP_ENABLED=${DEDUP_ENABLED:-false}
      - DEDUP_MAX_ENTRIES=${DEDUP_MAX_ENTRIES:-4096}
      - DEDUP_TTL_MS=${DEDUP_TTL_MS:-60000}
      - JAEGER_URL=http://jaeger:9411/api/v2/spans
      - THREAD_POOL_TYPE=custom
      - ENABLE_TRACING=true
      # Tracing tuning
      - TRACING_BATCH_SIZE=${TRACING_BATCH_SIZE:-50}
      - TRACING_FLUSH_INTERVAL_MS=${TRACING_FLUSH_INTERVAL_MS:-1000}
      - TRACING_SAMPLE_RATE=${TRACING_SAMPLE_RATE:-1.0}
      # Crash test diagnostic (raises SIGSEGV on startup)
      - CRASH_TEST=${CRASH_TEST:-false}
      # HTTP /crash-test endpoint (default off; only for test-crash-handler.py)
      - ENABLE_CRASH_TEST_ENDPOINT=${ENABLE_CRASH_TEST_ENDPOINT:-false}
      # /health/ready may initiate a blocking NATS reconnect (default off)
      - HEALTH_READY_ALLOW_CONNECT=${HEALTH_READY_ALLOW_CONNECT:-false}
      - ENABLE_SSL_SERVER_CERTIFICATE_VERIFICATION=false
      - ENABLE_SSL_SERVER_HOSTNAME_VERIFICATION=false
      #- SSL_CA_CERT_PATH=    # /root/ca-bundle.crt
      # NATS Configuration
      - NATS_HOST=${NATS_HOST:-nats-server}
      - NATS_PORT=${NATS_PORT:-4222}
      - NATS_SUBJECT=${NATS_SUBJECT:-service.proxy}
      - NATS_QUEUE_GROUP=${NATS_QUEUE_GROUP:-proxy_workers}
      - NATS_TIMEOUT_MS=${NATS_TIMEOUT_MS:-30000}
      # NATS Authentication (optional)
      - NATS_USERNAME=${NATS_USERNAME:-}
      - NATS_PASSWORD=${NATS_PASSWORD:-}
      - NATS_TOKEN=${NATS_TOKEN:-}
      - NATS_CREDENTIALS_FILE=${NATS_CREDENTIALS_FILE:-}
      # NATS TLS (optional)
      - NATS_ENABLE_TLS=${NATS_ENABLE_TLS:-false}
      - NATS_TLS_CERT_FILE=${NATS_TLS_CERT_FILE:-}
      - NATS_TLS_KEY_FILE=${NATS_TLS_KEY_FILE:-}
      - NATS_TLS_CA_CERT_FILE=${NATS_TLS_CA_CERT_FILE:-}
      # HTTP DB gateway: the worker owns the driver connection pools (Oracle
      # ODPI-C + PostgreSQL libpq; runtime-db image, Instant Client at
      # /opt/oracle). DB_QUERY_ENABLED=false disables the whole gateway. The
      # subscription is retried at startup until the databases are reachable,
      # so the worker tolerates a slow cold start.
      - DB_QUERY_ENABLED=${DB_QUERY_ENABLED:-true}
      - DB_QUERY_NATS_SUBJECT=${DB_QUERY_NATS_SUBJECT:-service.db.query}
      - DB_QUERY_NATS_QUEUE_GROUP=${DB_QUERY_NATS_QUEUE_GROUP:-db_workers}
      - DB_QUERY_NATS_TIMEOUT_MS=${DB_QUERY_NATS_TIMEOUT_MS:-30000}
      - DB_QUERY_DEFAULT_TIMEOUT_MS=${DB_QUERY_DEFAULT_TIMEOUT_MS:-5000}
      - DB_QUERY_DEFAULT_MAX_ROWS=${DB_QUERY_DEFAULT_MAX_ROWS:-1000}
      - DB_ORACLE_ENABLED=${DB_ORACLE_ENABLED:-false}
      - DB_ORACLE_HOST=${DB_ORACLE_HOST:-oracle}
      - DB_ORACLE_PORT=${DB_ORACLE_PORT:-1521}
      - DB_ORACLE_SERVICE=${DB_ORACLE_SERVICE:-XEPDB1}
      - DB_ORACLE_USER=${DB_ORACLE_USER:-app_user}
      - DB_ORACLE_PASSWORD=${DB_ORACLE_PASSWORD:-app_password}
      - DB_ORACLE_POOL_MIN=${DB_ORACLE_POOL_MIN:-1}
      - DB_ORACLE_POOL_MAX=${DB_ORACLE_POOL_MAX:-5}
      - DB_POSTGRES_ENABLED=${DB_POSTGRES_ENABLED:-true}
      - DB_POSTGRES_HOST=${DB_POSTGRES_HOST:-postgres}
      - DB_POSTGRES_PORT=${DB_POSTGRES_PORT:-5432}
      - DB_POSTGRES_DB=${DB_POSTGRES_DB:-app_db}
      - DB_POSTGRES_USER=${DB_POSTGRES_USER:-app_user}
      - DB_POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD:-app_password}
      - DB_POSTGRES_POOL_MIN=${DB_POSTGRES_POOL_MIN:-1}
      - DB_POSTGRES_POOL_MAX=${DB_POSTGRES_POOL_MAX:-5}
      # HTTPS server SSL configuration (optional - for client certificate verification)
      - SSL_SERVER_CERT_FILE=${SSL_SERVER_CERT_FILE:-}
      - SSL_SERVER_KEY_FILE=${SSL_SERVER_KEY_FILE:-}
      - SSL_CA_CERT_PATH=${SSL_CA_CERT_PATH:-}
      - ASAN_OPTIONS=${ASAN_OPTIONS:-detect_leaks=1:halt_on_error=0:log_path=/memory-logs/l2-worker-asan:ubsan_options=print_stacktrace=1}
      - LSAN_OPTIONS=${LSAN_OPTIONS:-report_objects=1}
      - UBSAN_OPTIONS=${UBSAN_OPTIONS:-print_stacktrace=1:halt_on_error=0}
    networks:
      - l2_network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "--max-time", "5", "http://localhost:19093/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      nats-server:
        condition: service_healthy

  # Grafana for metrics visualization
  grafana:
    container_name: grafana
    image: grafana/grafana:12.4
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - l2-proxy
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      # GF_INSTALL_PLUGINS=grafana-piechart-panel  # Deprecated - Angular plugins no longer supported
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - l2_network
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "--max-time", "5", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
#    profiles:
#      - nostart

networks:
  l2_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  grafana-storage:
    driver: local
  victoria-metrics-data:
    driver: local
  vmagent-data:
    driver: local
  nats-data:
    driver: local
  oracle-data:
    driver: local
  postgres-data:
    driver: local
