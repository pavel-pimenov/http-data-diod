x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # NATS Server for messaging
  nats-server:
    container_name: nats-server
    logging: *default-logging
    image: ${REGISTRY:-}nats:2.15.3-alpine
    restart: unless-stopped
    ports:
      - "4222:4222"  # NATS client port
      - "8222:8222"  # NATS monitoring port
    environment:
      # NATS Authentication (optional)
      - NATS_USER=${NATS_USER:-}
      - NATS_PASSWORD=${NATS_PASSWORD:-}
      - NATS_TOKEN=${NATS_TOKEN:-}
      # NATS TLS (optional)
      - NATS_ENABLE_TLS=${NATS_ENABLE_TLS:-false}
    command: >
      sh -c "
        # Static base config (port, JetStream, max_payload) lives in
        # nats/nats.conf (TLS variant) and nats/nats-notls.conf (local runs
        # without certificates), both mounted read-only. NATS_ENABLE_TLS
        # selects the variant. Only optional auth is appended at runtime to a
        # throwaway /tmp config (a copy of the base config plus the
        # authorization block) so the secret never appears in the nats-server
        # command line (visible via /proc/<pid>/cmdline) nor is committed to
        # git; it lives only in the container env and the /tmp file.
        CONF=/etc/nats/nats.conf;
        if [ \"$${NATS_ENABLE_TLS}\" != \"true\" ]; then
          CONF=/etc/nats/nats-notls.conf;
        fi;
        if [ -n \"$${NATS_TOKEN}\" ] || { [ -n \"$${NATS_USER}\" ] && [ -n \"$${NATS_PASSWORD}\" ]; }; then
          SRC=\"$${CONF}\";
          CONF=/tmp/nats-auth.conf;
          cat \"$${SRC}\" > \"$${CONF}\";
          if [ -n \"$${NATS_TOKEN}\" ]; then
            printf 'authorization { token: \"%s\" }' \"$${NATS_TOKEN}\" >> \"$${CONF}\";
            echo >> \"$${CONF}\";
          elif [ -n \"$${NATS_USER}\" ] && [ -n \"$${NATS_PASSWORD}\" ]; then
            printf 'authorization { user: \"%s\" password: \"%s\" }' \"$${NATS_USER}\" \"$${NATS_PASSWORD}\" >> \"$${CONF}\";
            echo >> \"$${CONF}\";
          fi;
        fi;
        exec nats-server -c \"$${CONF}\"
      "
    volumes:
      - nats-data:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - ./nats/nats-notls.conf:/etc/nats/nats-notls.conf:ro
      - ./certs_nats:/etc/nats/certs_nats:ro
    networks:
      - l2_network
    healthcheck:
      # Real readiness check: probe the monitoring /healthz endpoint instead of
      # just checking that the nats-server binary exists. 200 OK only when the
      # server is accepting connections (503/refused in lame-duck or while down).
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # NATS Exporter for Prometheus metrics
  nats-exporter:
    container_name: nats-exporter
    logging: *default-logging
    image: ${REGISTRY:-}natsio/prometheus-nats-exporter:0.20.3
    restart: unless-stopped
    ports:
      - "7778:7777"  # NATS exporter metrics port (7777 inside container, 7778 on host)
    command:
      - "-varz"
      - "-connz"
      - "-subz"
      - "http://nats-server:8222"
    depends_on:
      - nats-server
    networks:
      - l2_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7777/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nats-gui:
    container_name: nats-gui
    logging: *default-logging
    image: ${REGISTRY:-}sphqxe/nats-webui:latest
    restart: unless-stopped
    ports:
      - "7779:80"
    depends_on:
      - nats-server
#    volumes:
#      - ./nats-webui/sqlite.db:/usr/local/bin/nats/sqlite.db
    networks:
      - l2_network
    profiles:
      - nostart

  jaeger:
    container_name: jaeger
    logging: *default-logging
    image: ${REGISTRY:-}jaegertracing/jaeger:2.23.0
    restart: unless-stopped
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # Jaeger HTTP collector
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "9411:9411"    # Zipkin
      - "5778:5778"    # Config
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - l2_network
#    profiles:
#      - nostart

  # VictoriaMetrics - Prometheus-compatible metrics storage (lighter than Prometheus)
  victoria-metrics:
    container_name: l2-victoria-metrics
    logging: *default-logging
    image: ${REGISTRY:-}victoriametrics/victoria-metrics:v1.157.0
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    command:
      - '--httpListenAddr=:8428'
      - '--storageDataPath=/victoria-metrics-data'
      - '--retentionPeriod=15d'
      - '--search.maxQueryLen=1048576'
    networks:
      - l2_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8428/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # VictoriaMetrics Agent - scrapes metrics (VictoriaMetrics, без Prometheus)
  vmagent:
    container_name: vmagent
    logging: *default-logging
    image: ${REGISTRY:-}victoriametrics/vmagent:v1.157.0
    restart: unless-stopped
    ports:
      - "8429:8429"
    volumes:
      - ./scripts/vmagent.yml:/etc/vmagent/config.yml:ro
      - vmagent-data:/tmp/vmagent-remotewrite
    command:
      - '--promscrape.config=/etc/vmagent/config.yml'
      - '--remoteWrite.url=http://victoria-metrics:8428/api/v1/write'
      - '--httpListenAddr=:8429'
      - '--promscrape.streamParse=true'
      - '--envflag.enable=true'
    environment:
      - VM_NAME=${VM_NAME:-hostname}
    networks:
      - l2_network
    depends_on:
      - victoria-metrics
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8429/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # vmalert - выполняет правила оповещений из alerts/l2-alerts.yml.
  # Без Alertmanager уведомления уходят в blackhole: правила вычисляются,
  # активные алерты видно в /api/v1/alerts и в метриках vmalert_*.
  vmalert:
    container_name: vmalert
    logging: *default-logging
    image: ${REGISTRY:-}victoriametrics/vmalert:v1.157.0
    restart: unless-stopped
    ports:
      - "8880:8880"
    volumes:
      - ./alerts/l2-alerts.yml:/etc/vmalert/rules.yml:ro
    command:
      - '--datasource.url=http://victoria-metrics:8428'
      - '--rule=/etc/vmalert/rules.yml'
      - '--notifier.blackhole'
      - '--remoteWrite.url=http://victoria-metrics:8428'
      - '--httpListenAddr=:8880'
      - '--loggerLevel=WARN'
      - '--configCheckInterval=1m'
    networks:
      - l2_network
    depends_on:
      - victoria-metrics
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8880/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  l2-server:
    container_name: l2-server
    logging: *default-logging
    image: http-data-diod-l2-proxy:latest
    restart: unless-stopped
    mem_limit: ${L2_SERVER_MEM_LIMIT:-1g}
    # Non-root hardening: the image entrypoint drops to uid 10001 (see
    # src/docker-entrypoint.sh). The payload needs no Linux caps, only CHOWN/
    # FOWNER/DAC_OVERRIDE (host-mounted writable dirs + root-owned TLS certs)
    # and SETUID/SETGID which setpriv consumes while dropping to uid 10001
    # (effective caps are cleared on the setresuid, so the payload runs without
    # any capabilities). no-new-privileges is deliberately NOT set — it breaks
    # exec of shebang-script entrypoints in this setup.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    ports:
      - "29001:8088"
      - "19092:19092"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/root/logs
      - ./docker-memory-analysis:/memory-logs
      - ./crash-dumps:/crash-dumps
    environment:
      - MODE=l2-server
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - L2_SERVER_PROTOCOL=http
      - L2_SERVER_PORT=8088
      # Test-only: random response delay in ms (0 = disabled). Desynchronizes
      # response order for the response-to-request correlation test.
      - L2_TEST_RESPONSE_DELAY_MS=${L2_TEST_RESPONSE_DELAY_MS:-0}
      - JAEGER_URL=http://jaeger:9411/api/v2/spans
      - ENABLE_TRACING=true
      # Tracing tuning
      - TRACING_BATCH_SIZE=${TRACING_BATCH_SIZE:-50}
      - TRACING_FLUSH_INTERVAL_MS=${TRACING_FLUSH_INTERVAL_MS:-1000}
      - TRACING_SAMPLE_RATE=${TRACING_SAMPLE_RATE:-1.0}
      # Tracing outage circuit-breaker (shed tracing batches while a sink is down)
      - TRACING_OUTAGE_FAILURE_THRESHOLD=${TRACING_OUTAGE_FAILURE_THRESHOLD:-3}
      - TRACING_OUTAGE_COOLDOWN_BASE_MS=${TRACING_OUTAGE_COOLDOWN_BASE_MS:-1000}
      - TRACING_OUTAGE_COOLDOWN_MAX_MS=${TRACING_OUTAGE_COOLDOWN_MAX_MS:-30000}
      # Sentry error tracking (empty DSN = disabled)
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - SENTRY_SAMPLE_RATE=${SENTRY_SAMPLE_RATE:-1.0}
      - SENTRY_TIMEOUT_MS=${SENTRY_TIMEOUT_MS:-3000}
      - SENTRY_MAX_QUEUE_SIZE=${SENTRY_MAX_QUEUE_SIZE:-256}
      # Crash test diagnostic (raises SIGSEGV on startup)
      - CRASH_TEST=${CRASH_TEST:-false}
      # HTTP /crash-test endpoint (default off; only for test-crash-handler.py)
      - ENABLE_CRASH_TEST_ENDPOINT=${ENABLE_CRASH_TEST_ENDPOINT:-false}
      # Crash dump dir (matches the mounted ./crash-dumps volume)
      - CRASH_DUMP_DIR=/crash-dumps
      # /health/ready may initiate a blocking NATS reconnect (default off)
      - HEALTH_READY_ALLOW_CONNECT=${HEALTH_READY_ALLOW_CONNECT:-false}
      # HTTPS server SSL configuration (optional)
      - SSL_SERVER_CERT_FILE=${SSL_SERVER_CERT_FILE:-}
      - SSL_SERVER_KEY_FILE=${SSL_SERVER_KEY_FILE:-}
      - ASAN_OPTIONS=${ASAN_OPTIONS:-detect_leaks=1:halt_on_error=0:log_path=/memory-logs/l2-server-asan}
      - LSAN_OPTIONS=${LSAN_OPTIONS:-report_objects=1}
      - UBSAN_OPTIONS=${UBSAN_OPTIONS:-print_stacktrace=1:halt_on_error=0}
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "--max-time", "5", "http://localhost:19092/metrics"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - l2_network
#    profiles:
#      - nostart


  l2-test:
    container_name: l2-test
    image: ${REGISTRY:-}curlimages/curl:8.23.0
#    depends_on:
#      - l2-server
    networks:
      - l2_network
    command: >
      sh -c "
        echo 'Ожидание запуска l2-server...' &&
        sleep 5 &&
        echo 'Отправка тестового запроса...' &&
        curl -v --request POST -H 'Content-Type: application/json' -d '{\"value\": 1}' http://l2-server:8088/
      "
    profiles:
      - nostart

  # Oracle XE 21c for the HTTP DB gateway (l2-worker connects via ODPI-C).
  # First boot initializes the database (takes ~1-3 min); the worker retries
  # its DB subscription until the healthcheck turns green, so the rest of the
  # stack is unaffected while it starts up.
  #
  # Opt-in only (profile `databases`): databases normally live on a dedicated
  # node. Start them here on demand with:
  #   docker compose --profile databases up -d oracle
  oracle:
    container_name: oracle
    logging: *default-logging
    image: ${REGISTRY:-}gvenzl/oracle-xe:21.3.0-slim
    restart: unless-stopped
    profiles:
      - databases
    mem_limit: ${ORACLE_MEM_LIMIT:-2g}
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-oracle_password}
      - APP_USER=${DB_ORACLE_USER:-app_user}
      - APP_USER_PASSWORD=${DB_ORACLE_PASSWORD:-app_password}
      - ORACLE_CHARACTERSET=${ORACLE_CHARACTERSET:-AL32UTF8}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./sql/oracle.sql:/docker-entrypoint-initdb.d/01-oracle.sql:ro
    networks:
      - l2_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/healthcheck.sh > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # Self-hosted Sentry-compatible error tracking (glitchtip). Always part of the
  # stack (Sentry-совместимый аналог Sentry, порт 8000). Интеграция с C++
  # через SENTRY_DSN: l2-proxy / l2-worker / l2-server шлют события и
  # performance-транзакции в GlitchTip.
  # После первого запуска зарегистрируй юзера в UI (http://localhost:8000),
  # создай организацию + проект и подставь DSN проекта в .env / docker-compose:
  #   SENTRY_DSN=http://<public-key>@glitchtip:8000/<project-id>
  # glitchtip-db — выделенный PostgreSQL (образ уже есть локально);
  # основной postgres не задействован (DB gateway).
  glitchtip-db:
    container_name: glitchtip-db
    logging: *default-logging
    image: ${REGISTRY:-}postgres:17.12-alpine
    restart: unless-stopped
    mem_limit: ${GLITCHTIP_DB_MEM_LIMIT:-256m}
    environment:
      - POSTGRES_USER=${GLITCHTIP_DB_USER:-glitchtip}
      - POSTGRES_PASSWORD=${GLITCHTIP_DB_PASSWORD:-glitchtip_password}
      - POSTGRES_DB=${GLITCHTIP_DB_NAME:-glitchtip}
    volumes:
      - glitchtip-db-data:/var/lib/postgresql/data
    networks:
      - l2_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GLITCHTIP_DB_USER:-glitchtip} -d ${GLITCHTIP_DB_NAME:-glitchtip}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  glitchtip:
    container_name: glitchtip
    logging: *default-logging
    image: ${REGISTRY:-}glitchtip/glitchtip:7
    restart: unless-stopped
    mem_limit: ${GLITCHTIP_MEM_LIMIT:-1g}
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgres://${GLITCHTIP_DB_USER:-glitchtip}:${GLITCHTIP_DB_PASSWORD:-glitchtip_password}@glitchtip-db:5432/${GLITCHTIP_DB_NAME:-glitchtip}
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY:-change_me_to_something_random}
      - EMAIL_URL=consolemail://
      - GLITCHTIP_DOMAIN=http://localhost:8000
      - SERVER_ROLE=all_in_one
      # Disable Valkey (use Postgres for task queue/cache/session) to save RAM
      - VALKEY_URL=
      - ENABLE_USER_REGISTRATION=true
      - ENABLE_ORGANIZATION_CREATION=true
      - ENABLE_ADMIN=false
      - GLITCHTIP_ENABLE_UPTIME=false
      - GLITCHTIP_ENABLE_LOGS=false
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
    volumes:
      - glitchtip-uploads:/code/uploads
    depends_on:
      glitchtip-db:
        condition: service_healthy
    networks:
      - l2_network
    healthcheck:
      # glitchtip image has no curl/wget; python3 is present at
      # /usr/local/bin/python3
      test: ["CMD", "/usr/local/bin/python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # PostgreSQL 17 for the HTTP DB gateway (l2-worker connects via libpq).
  # init scripts run on the first boot via /docker-entrypoint-initdb.d.
  #
  # Opt-in only (profile `databases`): the DB gateway also works with an
  # external PostgreSQL by pointing DB_POSTGRES_HOST at the remote node, so the
  # local stack does not need to run one. Start it here on demand with:
  #   docker compose --profile databases up -d postgres
  postgres:
    container_name: postgres
    logging: *default-logging
    # Pinned to the latest patch of 17: postgres-data volume was re-initialized
    # by PG17, and 16 refuses to start on it ("database files are incompatible").
    # Do NOT bump the major version without pg_upgrade or wiping the volume
    # (data loss).
    image: ${REGISTRY:-}postgres:17.12-alpine
    restart: unless-stopped
    profiles:
      - databases
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app_password}
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/postgres.sql:/docker-entrypoint-initdb.d/01-postgres.sql:ro
    networks:
      - l2_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Swagger UI for the HTTP DB gateway API (docs/openapi/http-db-gate.yaml).
  # Serves the spec at http://localhost:8081/http-db-gate.yaml and renders the
  # interactive documentation on the root page.
  swagger-ui:
    container_name: swagger-ui
    logging: *default-logging
    image: ${REGISTRY:-}swaggerapi/swagger-ui:v5.36.0
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # Path (inside the container) where the spec file is mounted. The
      # entrypoint symlinks it into the nginx root and points the UI at it.
      - SWAGGER_JSON=/tmp/http-db-gate.yaml
    volumes:
      - ./docs/openapi/http-db-gate.yaml:/tmp/http-db-gate.yaml:ro
    networks:
      - l2_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  l2-proxy:
    container_name: l2-proxy
    logging: *default-logging
    build:
      context: ./src
      dockerfile: Dockerfile
      target: ${L2_PROXY_DOCKER_TARGET:-runtime}
      args:
        BASE_IMAGE: "${BASE_IMAGE:-${REGISTRY:-}ubuntu:26.04}"
        REGISTRY_MIRROR: "${REGISTRY:-}"
        APT_MIRROR: "${APT_MIRROR:-}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
        ENABLE_ASAN: "${ENABLE_ASAN:-false}"
        ENABLE_PROFILER: "${ENABLE_PROFILER:-false}"
        CACHE_BUST: "${CACHE_BUST:-1}"
    restart: unless-stopped
    # Covers the in-flight drain window (30s) plus the NATS C-library teardown
    # (measured 1-19s) so docker never SIGKILLs mid-drain on rolling deploys.
    stop_grace_period: 40s
    mem_limit: ${L2_PROXY_MEM_LIMIT:-1g}
    # Non-root hardening: same as l2-server (see src/docker-entrypoint.sh).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    ports:
      # Inside the compose network the proxy keeps 8888, which is what
      # nginx/worker use.
      - "29002:8888"
      - "19090:19090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/root/logs
      - ./docker-memory-analysis:/memory-logs
      - ./certs_nats:/etc/nats/certs_nats:ro
      - ./crash-dumps:/crash-dumps
    environment:
      - PROXY_PORT=8888
      - PROXY_PROTOCOL=http
      - MODE=proxy
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - REQUEST_TIMEOUT_SECONDS=30
      # Limit on the number of HTTP tasks waiting in the proxy's task queue.
      # 0 selects the automatic bound (8 tasks per worker thread, the same rule
      # the worker pool applies); a non-zero value sets it explicitly. Either
      # way queue overflow becomes a rejected request instead of unbounded
      # memory growth, and l2_proxy_task_queue_saturated has a denominator.
      - L2_PROXY_MAX_QUEUED_REQUESTS=${L2_PROXY_MAX_QUEUED_REQUESTS:-0}
      # Forward non-JSON request bodies (zlib-compressed payloads) verbatim:
      # they are base64-encoded over NATS and decoded by the worker.
      # false = legacy behaviour (400 Invalid JSON). The bundled l2-server stub
      # speaks JSON, so only an external upstream enables this.
      - PROXY_RAW_BODY_PASSTHROUGH=${PROXY_RAW_BODY_PASSTHROUGH:-false}
      - JAEGER_URL=http://jaeger:9411/api/v2/spans
      - ENABLE_TRACING=true
      # NATS Configuration
      - NATS_HOST=${NATS_HOST:-nats-server}
      - NATS_PORT=${NATS_PORT:-4222}
      - NATS_SUBJECT=${NATS_SUBJECT:-service.proxy}
      - NATS_QUEUE_GROUP=${NATS_QUEUE_GROUP:-proxy_workers}
      - NATS_TIMEOUT_MS=${NATS_TIMEOUT_MS:-30000}
      - NATS_CONNECT_TIMEOUT_MS=${NATS_CONNECT_TIMEOUT_MS:-5000}
      # NATS Authentication (optional)
      - NATS_USERNAME=${NATS_USERNAME:-}
      - NATS_PASSWORD=${NATS_PASSWORD:-}
      - NATS_TOKEN=${NATS_TOKEN:-}
      - NATS_CREDENTIALS_FILE=${NATS_CREDENTIALS_FILE:-}
      # NATS TLS (optional)
      - NATS_ENABLE_TLS=${NATS_ENABLE_TLS:-false}
      - NATS_TLS_CERT_FILE=${NATS_TLS_CERT_FILE:-}
      - NATS_TLS_KEY_FILE=${NATS_TLS_KEY_FILE:-}
      - NATS_TLS_CA_CERT_FILE=${NATS_TLS_CA_CERT_FILE:-}
      # HTTP DB gateway (route /v1/sql/* to the DB worker over NATS). The proxy
      # needs only the enabled flags (to register DB names for listing/validation)
      # and the NATS routing config; the driver connection pools (host/port/
      # credentials/sizes) and per-query defaults are owned solely by the worker,
      # so those env vars are NOT passed here. The wide DB_QUERY_NATS_QUEUE_GROUP
      # subscription also lives on the worker only.
      - DB_QUERY_ENABLED=${DB_QUERY_ENABLED:-true}
      - DB_QUERY_NATS_SUBJECT=${DB_QUERY_NATS_SUBJECT:-service.db.query}
      - DB_QUERY_NATS_TIMEOUT_MS=${DB_QUERY_NATS_TIMEOUT_MS:-30000}
      - DB_ORACLE_ENABLED=${DB_ORACLE_ENABLED:-false}
      - DB_POSTGRES_ENABLED=${DB_POSTGRES_ENABLED:-true}
      # Per-IP rate limiting
      - ENABLE_PER_IP_RATE_LIMITING=${ENABLE_PER_IP_RATE_LIMITING:-true}
      # Per-IP rate limiting tuning (only when ENABLE_PER_IP_RATE_LIMITING=true)
      - PER_IP_MAX_TOKENS=${PER_IP_MAX_TOKENS:-10000}
      - PER_IP_REFILL_RATE=${PER_IP_REFILL_RATE:-1000}
      - PER_IP_MAX_IPS=${PER_IP_MAX_IPS:-10000}
      - PER_IP_CLEANUP_TTL_SECONDS=${PER_IP_CLEANUP_TTL_SECONDS:-300}
      # Global rate limiting (all proxy requests; disable for load testing)
      - ENABLE_GLOBAL_RATE_LIMITING=${ENABLE_GLOBAL_RATE_LIMITING:-true}
      - GLOBAL_RATE_LIMIT_MAX_TOKENS=${GLOBAL_RATE_LIMIT_MAX_TOKENS:-10000}
      - GLOBAL_RATE_LIMIT_REFILL_RATE=${GLOBAL_RATE_LIMIT_REFILL_RATE:-1000}
      # Duplicate POST detection (report on GET /debug/duplicates)
      - DUPLICATE_DETECTION_ENABLED=${DUPLICATE_DETECTION_ENABLED:-true}
      - DUPLICATE_DETECTION_TOP_N=${DUPLICATE_DETECTION_TOP_N:-100}
      - DUPLICATE_DETECTION_MAX_ENTRIES=${DUPLICATE_DETECTION_MAX_ENTRIES:-1000}
      - DUPLICATE_DETECTION_MAX_BODY_BYTES=${DUPLICATE_DETECTION_MAX_BODY_BYTES:-500}
      - DUPLICATE_DETECTION_TTL_MS=${DUPLICATE_DETECTION_TTL_MS:-60000}
      # Log every N duplicate POST bodies from the same client_id (0 = off)
      - DUPLICATE_LOG_THRESHOLD=${DUPLICATE_LOG_THRESHOLD:-5}
      # Bound on client ids tracked by the duplicate detector (0 = unbounded);
      # idle client counters are dropped after CLIENT_TTL_MS of inactivity
      - DUPLICATE_DETECTION_MAX_CLIENTS=${DUPLICATE_DETECTION_MAX_CLIENTS:-1000}
      - DUPLICATE_DETECTION_CLIENT_TTL_MS=${DUPLICATE_DETECTION_CLIENT_TTL_MS:-1800000}
      # Reject (HTTP 409) a duplicate POST body within the detector TTL instead
      # of forwarding it (default false: only count/log duplicates)
      - DUPLICATE_REJECT_ENABLED=${DUPLICATE_REJECT_ENABLED:-false}
      # Tracing tuning
      - TRACING_BATCH_SIZE=${TRACING_BATCH_SIZE:-50}
      - TRACING_FLUSH_INTERVAL_MS=${TRACING_FLUSH_INTERVAL_MS:-1000}
      - TRACING_SAMPLE_RATE=${TRACING_SAMPLE_RATE:-1.0}
      # Tracing outage circuit-breaker (shed tracing batches while a sink is down)
      - TRACING_OUTAGE_FAILURE_THRESHOLD=${TRACING_OUTAGE_FAILURE_THRESHOLD:-3}
      - TRACING_OUTAGE_COOLDOWN_BASE_MS=${TRACING_OUTAGE_COOLDOWN_BASE_MS:-1000}
      - TRACING_OUTAGE_COOLDOWN_MAX_MS=${TRACING_OUTAGE_COOLDOWN_MAX_MS:-30000}
      # Sentry error tracking (empty DSN = disabled)
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - SENTRY_SAMPLE_RATE=${SENTRY_SAMPLE_RATE:-1.0}
      - SENTRY_TIMEOUT_MS=${SENTRY_TIMEOUT_MS:-3000}
      - SENTRY_MAX_QUEUE_SIZE=${SENTRY_MAX_QUEUE_SIZE:-256}
      # Crash test diagnostic (raises SIGSEGV on startup)
      - CRASH_TEST=${CRASH_TEST:-false}
      # HTTP /crash-test endpoint (default off; only for test-crash-handler.py)
      - ENABLE_CRASH_TEST_ENDPOINT=${ENABLE_CRASH_TEST_ENDPOINT:-false}
      # Crash dump dir (matches the mounted ./crash-dumps volume)
      - CRASH_DUMP_DIR=/crash-dumps
      # /health/ready may initiate a blocking NATS reconnect (default off)
      - HEALTH_READY_ALLOW_CONNECT=${HEALTH_READY_ALLOW_CONNECT:-false}
      # HTTPS server SSL configuration (optional)
      - SSL_SERVER_CERT_FILE=${SSL_SERVER_CERT_FILE:-}
      - SSL_SERVER_KEY_FILE=${SSL_SERVER_KEY_FILE:-}
      - ASAN_OPTIONS=${ASAN_OPTIONS:-detect_leaks=1:halt_on_error=0:log_path=/memory-logs/l2-proxy-asan}
      - LSAN_OPTIONS=${LSAN_OPTIONS:-report_objects=1}
      - UBSAN_OPTIONS=${UBSAN_OPTIONS:-print_stacktrace=1:halt_on_error=0}
    networks:
      - l2_network
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "--max-time", "5", "http://localhost:8888/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      nats-server:
        condition: service_healthy

  nginx:
    container_name: nginx
    logging: *default-logging
    image: ${REGISTRY:-}nginx:1.30.8-alpine
    restart: unless-stopped
    ports:
      - "29003:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - l2-proxy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - l2_network

  # Nginx metrics exporter for Prometheus
  nginx-exporter:
    container_name: nginx-exporter
    logging: *default-logging
    image: ${REGISTRY:-}nginx/nginx-prometheus-exporter:1.5.3
    restart: unless-stopped
    ports:
      - "9113:9113"
    environment:
      - SCRAPE_URI=http://nginx/metrics
    depends_on:
      - nginx
    networks:
      - l2_network
#    profiles:
#      - nostart

  l2-worker:
    container_name: l2-worker
    logging: *default-logging
    build:
      context: ./src
      dockerfile: Dockerfile
      # The Oracle OCI client is baked into the shared runtime-base, so the
      # single l2-proxy binary (any MODE: proxy/worker/server) can talk to
      # Oracle DBs. `runtime-db` is kept as an alias of `runtime` for backward
      # compatibility with the old opt-in target.
      target: ${L2_WORKER_DOCKER_TARGET:-runtime}
      args:
        BASE_IMAGE: "${BASE_IMAGE:-${REGISTRY:-}ubuntu:26.04}"
        REGISTRY_MIRROR: "${REGISTRY:-}"
        APT_MIRROR: "${APT_MIRROR:-}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
        ENABLE_ASAN: "${ENABLE_ASAN:-false}"
        ENABLE_PROFILER: "${ENABLE_PROFILER:-false}"
        CACHE_BUST: "${CACHE_BUST:-1}"
    restart: unless-stopped
    # Same rationale as l2-proxy: in-flight drain (30s) + NATS teardown (1-19s).
    stop_grace_period: 40s
    mem_limit: ${L2_WORKER_MEM_LIMIT:-1g}
    # Non-root hardening: same as l2-server (see src/docker-entrypoint.sh).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    ports:
      - "19091:19091"
      - "19093:19093"
#    depends_on:
#      - l2-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/root/logs
      - ./docker-memory-analysis:/memory-logs
      - ./certs_nats:/etc/nats/certs_nats:ro
      - ./crash-dumps:/crash-dumps
    environment:
      - MODE=worker
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      # Optimized timeouts for faster failure detection
      - HTTP_POOL_SIZE=${HTTP_POOL_SIZE:-128}
      - HTTP_POOL_IDLE_TIMEOUT_SECONDS=${HTTP_POOL_IDLE_TIMEOUT_SECONDS:-300}
      # Upstream HTTP backend. Defaults to the bundled l2-server test stub;
      # L2_SERVER_URLS overrides it with a JSON array of real upstreams.
      - L2_SERVER_PROTOCOL=${L2_SERVER_PROTOCOL:-http}
      - L2_SERVER_HOST=${L2_SERVER_HOST:-l2-server}
      - L2_SERVER_PORT=${L2_SERVER_PORT:-8088}
      - L2_SERVER_URLS=${L2_SERVER_URLS:-}
      - HTTP_TIMEOUT_SECONDS=10
      - L2_WORKER_THREADS=${L2_WORKER_THREADS:-128}
      - L2_WORKER_QUEUE_SIZE=${L2_WORKER_QUEUE_SIZE:-0}
      - MAX_RETRIES=1
      # Dedup cache for duplicate NATS requests (DEDUP_ENABLED=true enables at-most-once L2)
      - DEDUP_ENABLED=${DEDUP_ENABLED:-true}
      - DEDUP_MAX_ENTRIES=${DEDUP_MAX_ENTRIES:-4096}
      - DEDUP_TTL_MS=${DEDUP_TTL_MS:-60000}
      - JAEGER_URL=http://jaeger:9411/api/v2/spans
      - THREAD_POOL_TYPE=custom
      - ENABLE_TRACING=true
      # Tracing tuning
      - TRACING_BATCH_SIZE=${TRACING_BATCH_SIZE:-50}
      - TRACING_FLUSH_INTERVAL_MS=${TRACING_FLUSH_INTERVAL_MS:-1000}
      - TRACING_SAMPLE_RATE=${TRACING_SAMPLE_RATE:-1.0}
      # Tracing outage circuit-breaker (shed tracing batches while a sink is down)
      - TRACING_OUTAGE_FAILURE_THRESHOLD=${TRACING_OUTAGE_FAILURE_THRESHOLD:-3}
      - TRACING_OUTAGE_COOLDOWN_BASE_MS=${TRACING_OUTAGE_COOLDOWN_BASE_MS:-1000}
      - TRACING_OUTAGE_COOLDOWN_MAX_MS=${TRACING_OUTAGE_COOLDOWN_MAX_MS:-30000}
      # Sentry error tracking (empty DSN = disabled)
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - SENTRY_SAMPLE_RATE=${SENTRY_SAMPLE_RATE:-1.0}
      - SENTRY_TIMEOUT_MS=${SENTRY_TIMEOUT_MS:-3000}
      - SENTRY_MAX_QUEUE_SIZE=${SENTRY_MAX_QUEUE_SIZE:-256}
      # Crash test diagnostic (raises SIGSEGV on startup)
      - CRASH_TEST=${CRASH_TEST:-false}
      # HTTP /crash-test endpoint (default off; only for test-crash-handler.py)
      - ENABLE_CRASH_TEST_ENDPOINT=${ENABLE_CRASH_TEST_ENDPOINT:-false}
      # Crash dump dir (matches the mounted ./crash-dumps volume)
      - CRASH_DUMP_DIR=/crash-dumps
      # /health/ready may initiate a blocking NATS reconnect (default off)
      - HEALTH_READY_ALLOW_CONNECT=${HEALTH_READY_ALLOW_CONNECT:-false}
      - ENABLE_SSL_SERVER_CERTIFICATE_VERIFICATION=false
      - ENABLE_SSL_SERVER_HOSTNAME_VERIFICATION=false
      # NATS Configuration
      - NATS_HOST=${NATS_HOST:-nats-server}
      - NATS_PORT=${NATS_PORT:-4222}
      - NATS_SUBJECT=${NATS_SUBJECT:-service.proxy}
      - NATS_QUEUE_GROUP=${NATS_QUEUE_GROUP:-proxy_workers}
      - NATS_TIMEOUT_MS=${NATS_TIMEOUT_MS:-30000}
      - NATS_CONNECT_TIMEOUT_MS=${NATS_CONNECT_TIMEOUT_MS:-5000}
      # NATS Authentication (optional)
      - NATS_USERNAME=${NATS_USERNAME:-}
      - NATS_PASSWORD=${NATS_PASSWORD:-}
      - NATS_TOKEN=${NATS_TOKEN:-}
      - NATS_CREDENTIALS_FILE=${NATS_CREDENTIALS_FILE:-}
      # NATS TLS (optional)
      - NATS_ENABLE_TLS=${NATS_ENABLE_TLS:-false}
      - NATS_TLS_CERT_FILE=${NATS_TLS_CERT_FILE:-}
      - NATS_TLS_KEY_FILE=${NATS_TLS_KEY_FILE:-}
      - NATS_TLS_CA_CERT_FILE=${NATS_TLS_CA_CERT_FILE:-}
      # HTTP DB gateway: the worker owns the driver connection pools (Oracle
      # ODPI-C + PostgreSQL libpq). The runtime image carries both libpq and the
      # Oracle OCI client (baked into the shared runtime-base). Databases may be
      # external: point DB_POSTGRES_HOST/DB_ORACLE_HOST at the DB node.
      # DB_QUERY_ENABLED=false disables the whole gateway. The subscription is
      # retried at startup until the databases are reachable, so the worker
      # tolerates a slow cold start.
      - DB_QUERY_ENABLED=${DB_QUERY_ENABLED:-true}
      - DB_QUERY_NATS_SUBJECT=${DB_QUERY_NATS_SUBJECT:-service.db.query}
      - DB_QUERY_NATS_QUEUE_GROUP=${DB_QUERY_NATS_QUEUE_GROUP:-db_workers}
      - DB_QUERY_NATS_TIMEOUT_MS=${DB_QUERY_NATS_TIMEOUT_MS:-30000}
      - DB_QUERY_DEFAULT_TIMEOUT_MS=${DB_QUERY_DEFAULT_TIMEOUT_MS:-5000}
      - DB_QUERY_DEFAULT_MAX_ROWS=${DB_QUERY_DEFAULT_MAX_ROWS:-1000}
      - DB_ORACLE_ENABLED=${DB_ORACLE_ENABLED:-false}
      - DB_ORACLE_HOST=${DB_ORACLE_HOST:-oracle}
      - DB_ORACLE_PORT=${DB_ORACLE_PORT:-1521}
      - DB_ORACLE_SERVICE=${DB_ORACLE_SERVICE:-XEPDB1}
      - DB_ORACLE_USER=${DB_ORACLE_USER:-app_user}
      - DB_ORACLE_PASSWORD=${DB_ORACLE_PASSWORD:-app_password}
      - DB_ORACLE_POOL_MIN=${DB_ORACLE_POOL_MIN:-1}
      - DB_ORACLE_POOL_MAX=${DB_ORACLE_POOL_MAX:-5}
      - DB_POSTGRES_ENABLED=${DB_POSTGRES_ENABLED:-true}
      - DB_POSTGRES_HOST=${DB_POSTGRES_HOST:-postgres}
      - DB_POSTGRES_PORT=${DB_POSTGRES_PORT:-5432}
      - DB_POSTGRES_DB=${DB_POSTGRES_DB:-app_db}
      - DB_POSTGRES_USER=${DB_POSTGRES_USER:-app_user}
      - DB_POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD:-app_password}
      - DB_POSTGRES_POOL_MIN=${DB_POSTGRES_POOL_MIN:-1}
      - DB_POSTGRES_POOL_MAX=${DB_POSTGRES_POOL_MAX:-5}
      # HTTPS client settings for outbound calls to l2-server (the worker does not
      # run an TLS server; the pool only verifies the upstream server).
      - SSL_CA_CERT_PATH=${SSL_CA_CERT_PATH:-}
      - ASAN_OPTIONS=${ASAN_OPTIONS:-detect_leaks=1:halt_on_error=0:log_path=/memory-logs/l2-worker-asan}
      - LSAN_OPTIONS=${LSAN_OPTIONS:-report_objects=1}
      - UBSAN_OPTIONS=${UBSAN_OPTIONS:-print_stacktrace=1:halt_on_error=0}
    networks:
      - l2_network
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "--max-time", "5", "http://localhost:19093/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      nats-server:
        condition: service_healthy

  # l2-db-spider: периодически опрашивает базы данных (Oracle/PostgreSQL)
  # произвольными SELECT-запросами из INI-конфига DB_SPIDER_CONFIG_FILE и пишет
  # результат в JSON-файлы <db>_<query>.json в ./spider-output (монтируется
  # внутрь). Oracle-клиент встроен в общий runtime-base, так что Oracle
  # доступен всем режимам (proxy/worker/server) без отдельного таргета.
  l2-db-spider:
    container_name: l2-db-spider
    logging: *default-logging
    build:
      context: ./src
      dockerfile: Dockerfile
      target: ${L2_WORKER_DOCKER_TARGET:-runtime}
      args:
        BASE_IMAGE: "${BASE_IMAGE:-${REGISTRY:-}ubuntu:26.04}"
        REGISTRY_MIRROR: "${REGISTRY:-}"
        APT_MIRROR: "${APT_MIRROR:-}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
        ENABLE_ASAN: "${ENABLE_ASAN:-false}"
        ENABLE_PROFILER: "${ENABLE_PROFILER:-false}"
        CACHE_BUST: "${CACHE_BUST:-1}"
    restart: unless-stopped
    mem_limit: ${L2_DB_SPIDER_MEM_LIMIT:-2048m}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    ports:
      - "19094:19094"
      - "19095:19095"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/root/logs
      - ./spider-output:/spider
      - ./crash-dumps:/crash-dumps
      - ./spider-config.ini:/spider/spider-config.ini:ro
      - ./spider-sql:/spider/spider-sql:ro
    environment:
      - MODE=l2-db-spider
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - DB_SPIDER_ENABLED=${DB_SPIDER_ENABLED:-true}
      - DB_SPIDER_INTERVAL_SECONDS=${DB_SPIDER_INTERVAL_SECONDS:-86400}
      - DB_SPIDER_OUTPUT_DIR=/spider
      - DB_SPIDER_CONFIG_FILE=/spider/spider-config.ini
      - DB_SPIDER_PASSWORD=${DB_SPIDER_PASSWORD:-}
      - DB_SPIDER_USER_CCM2=${DB_SPIDER_USER_CCM2:-}
      - DB_SPIDER_USER_CCM4=${DB_SPIDER_USER_CCM4:-}
      - DB_SPIDER_USER_CCM5=${DB_SPIDER_USER_CCM5:-}
      - DB_SPIDER_USER_BFM=${DB_SPIDER_USER_BFM:-}
      - DB_SPIDER_PASSWORD_BFM=${DB_SPIDER_PASSWORD_BFM:-}
      - DB_SPIDER_USER_MES=${DB_SPIDER_USER_MES:-}
      - DB_SPIDER_PASSWORD_MES=${DB_SPIDER_PASSWORD_MES:-}
      - DB_SPIDER_USER_ENERGY=${DB_SPIDER_USER_ENERGY:-}
      - DB_SPIDER_PASSWORD_ENERGY=${DB_SPIDER_PASSWORD_ENERGY:-}
      - DB_SPIDER_USER_KKC1CCY=${DB_SPIDER_USER_KKC1CCY:-}
      - DB_SPIDER_PASSWORD_KKC1CCY=${DB_SPIDER_PASSWORD_KKC1CCY:-}
      - DB_SPIDER_USER_KKC2CCY=${DB_SPIDER_USER_KKC2CCY:-}
      - DB_SPIDER_PASSWORD_KKC2CCY=${DB_SPIDER_PASSWORD_KKC2CCY:-}
      - DB_SPIDER_USER_NMES=${DB_SPIDER_USER_NMES:-}
      - DB_SPIDER_PASSWORD_NMES=${DB_SPIDER_PASSWORD_NMES:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - CRASH_DUMP_DIR=/crash-dumps
      - CRASH_TEST=${CRASH_TEST:-false}
      - ASAN_OPTIONS=${ASAN_OPTIONS:-detect_leaks=1:halt_on_error=0:log_path=/memory-logs/l2-db-spider-asan}
      - LSAN_OPTIONS=${LSAN_OPTIONS:-report_objects=1}
      - UBSAN_OPTIONS=${UBSAN_OPTIONS:-print_stacktrace=1:halt_on_error=0}
    networks:
      - l2_network
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "--max-time", "5", "http://localhost:19095/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # l2-spider-ai: веб-сервер прогресса AI-генерации отчёта по данным l2-db-spider.
  # Читает ./spider-output, шлёт данные внешней модели (AI_API_URL) и пишет
  # report.md/report.pdf в ./spider-output/ai. Слушает порт 19096 (страница
  # прогресса + JSON /progress + /report.md + /report.pdf). Отдельный образ
  # pdf-report (Ubuntu 26.04 + reportlab), НЕ runtime-бинарник.
  l2-spider-ai:
    container_name: l2-spider-ai
    logging: *default-logging
    build:
      context: .
      dockerfile: src/Dockerfile
      target: spider-ai
      args:
        BASE_IMAGE: "${BASE_IMAGE:-${REGISTRY:-}ubuntu:26.04}"
        REGISTRY_MIRROR: "${REGISTRY:-}"
        APT_MIRROR: "${APT_MIRROR:-}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
    restart: unless-stopped
    ports:
      - "19096:19096"
    volumes:
      - ./spider-output:/work/spider-output
    environment:
      - SPIDER_AI_PORT=19096
      - AI_API_URL=${AI_API_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_TIMEOUT=${AI_TIMEOUT:-600}
      - AI_AI_ROWS=${AI_AI_ROWS:-40}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-6000}
    networks:
      - l2_network
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "--max-time", "5", "http://localhost:19096/progress"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # l2-hub — стартовая страница-хаб со всеми сервисами стека (плашки с
  # ссылками на их веб-интерфейсы и live-статусами). Статический nginx,
  # отдаёт ./www на порту 443. Удобно переключаться между сервисами.
  l2-hub:
    container_name: l2-hub
    logging: *default-logging
    image: ${REGISTRY:-}nginx:1.30.8-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./www/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/ssl:ro
    networks:
      - l2_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # l2-heat-scraper — перебор плавок (GetHeatData) через прокси-цепочку l2 и
  # сохранение ответа каждой плавки в отдельный JSON-файл в ./heat-output.
  # Запускается по demand (docker compose run l2-heat-scraper), не restart.
  # Параметры (start/count) задаются env или CLI; позже вынесем в GUI.
  l2-heat-scraper:
    container_name: l2-heat-scraper
    logging: *default-logging
    build:
      context: .
      dockerfile: src/Dockerfile
      target: heat-scraper
      args:
        BASE_IMAGE: "${BASE_IMAGE:-${REGISTRY:-}ubuntu:26.04}"
        REGISTRY_MIRROR: "${REGISTRY:-}"
        APT_MIRROR: "${APT_MIRROR:-}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
    restart: "no"
    volumes:
      - ./heat-output:/work/heat-output
    environment:
      - HEAT_SCRAPE_URL=${HEAT_SCRAPE_URL:-http://nl-sp-p3pg-ad1.ao.nlmk:29003/DataHubRobots/DataHubSrv}
      - HEAT_SCRAPE_USER=${HEAT_SCRAPE_USER:-}
      - HEAT_SCRAPE_PASSWORD=${HEAT_SCRAPE_PASSWORD:-}
      - HEAT_SCRAPE_CLIENT_ID=${HEAT_SCRAPE_CLIENT_ID:-}
      - HEAT_SCRAPE_START=${HEAT_SCRAPE_START:-23143}
      - HEAT_SCRAPE_COUNT=${HEAT_SCRAPE_COUNT:-100}
      - HEAT_SCRAPE_OUTPUT_DIR=/work/heat-output
    networks:
      - l2_network
    command: ["--output-dir", "/work/heat-output"]

  # l2-heat-ai — веб-сервер прогресса AI-генерации отчёта по плавкам (GetHeatData).
  # Читает heat_*.json из ./heat-output, шлёт их AI-модели, отдаёт report.md/pdf
  # на HTML-странице прогресса. Порт 19097. По аналогии с l2-spider-ai.
  l2-heat-ai:
    container_name: l2-heat-ai
    logging: *default-logging
    build:
      context: .
      dockerfile: src/Dockerfile
      target: heat-ai
      args:
        BASE_IMAGE: "${BASE_IMAGE:-${REGISTRY:-}ubuntu:26.04}"
        REGISTRY_MIRROR: "${REGISTRY:-}"
        APT_MIRROR: "${APT_MIRROR:-}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
    restart: unless-stopped
    ports:
      - "19097:19097"
    volumes:
      - ./heat-output:/work/heat-output
    environment:
      - HEAT_AI_PORT=19097
      - HEAT_AI_MAX_HEATS=${HEAT_AI_MAX_HEATS:-500}
      - AI_API_URL=${AI_API_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_TIMEOUT=${AI_TIMEOUT:-600}
      - AI_AI_ROWS=${AI_AI_ROWS:-80}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-6000}
    networks:
      - l2_network
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "--max-time", "5", "http://localhost:19097/progress"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Perses — лёгкий UI дашбордов (порт 8089/8080). Оба UI (Grafana и Perses)
  # читают одни и те же определения панелей из
  # scripts/generate-grafana-dashboards.py: Perses через нативный конвертер
  # scripts/generate-perses-dashboards.py, Grafana через
  # scripts/generate-grafana-dashboards.py --correct-dashboards.
  # Хост-порт 8080 занят сторонними процессами, поэтому наружу пробрасываем 8089.
  # Дашборды и глобальный Prometheus-датасорс (proxy на VictoriaMetrics)
  # накатываются скриптами по REST API.
  # Docker-healthcheck не вешаем: базовый образ distroless (без curl/sh),
  # готовность проверяем в rebuild-and-run.sh через host-curl.
  perses:
    # Renamed host-side to l2-perses (host port 8089 stays the diode
    # instance's entry point).
    container_name: l2-perses
    logging: *default-logging
    image: ${REGISTRY:-}persesdev/perses:v0.55.1
    restart: unless-stopped
    ports:
      - "8089:8080"
    volumes:
      - perses-data:/perses
    depends_on:
      - l2-proxy
    networks:
      - l2_network

  # Grafana — второй UI дашбордов (порт 3000). Возвращён в стек: читает те же
  # определения панелей из scripts/generate-grafana-dashboards.py, что и Perses,
  # поэтому даёт полную витрину метрик (PromQL, template variables) в классическом
  # интерфейсе. Дашборды и Prometheus-датасорс (proxy на VictoriaMetrics)
  # накатываются scripts/generate-grafana-dashboards.py --correct-dashboards.
  grafana:
    container_name: grafana
    logging: *default-logging
    image: ${REGISTRY:-}grafana/grafana:13.3.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - l2-proxy
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - l2_network
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "--max-time", "5", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # One-shot sidecar: generates/updates Grafana dashboards via the generator
  # script on startup. The target Grafana may live on another host — point
  # GRAFANA_URL at it (e.g. http://grafana-host:3000). Exits 0 after a
  # successful sync (restart on-failure only retries on error).
  grafana-dashboards-sync:
    container_name: grafana-dashboards-sync
    image: ${GRAFANA_SYNC_IMAGE:-${REGISTRY:-}l2-dashboards-sync:${GRAFANA_SYNC_TAG:-latest}}
    build:
      context: .
      dockerfile: src/Dockerfile
      target: grafana-sync
      args:
        BASE_IMAGE: "${BASE_IMAGE:-${REGISTRY:-}ubuntu:26.04}"
        REGISTRY_MIRROR: "${REGISTRY:-}"
        APT_MIRROR: "${APT_MIRROR:-}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
    restart: on-failure
    environment:
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_USER=${GRAFANA_USER:-admin}
      - GRAFANA_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - l2_network

  # Registry report server: web UI to collect/show reports about Docker
  # registries (sizes, tags). Reports are saved to a named volume. Credentials
  # for registries come from .env (REGISTRY_<NAME>_URL/_USER/_PASSWORD).
  registry-report-server:
    container_name: registry-report-server
    image: ${REGISTRY_REPORT_IMAGE:-${REGISTRY:-}l2-registry-report-server:${REGISTRY_REPORT_TAG:-latest}}
    build:
      context: .
      dockerfile: src/Dockerfile
      target: registry-report-server
      args:
        BASE_IMAGE: "${BASE_IMAGE:-${REGISTRY:-}ubuntu:26.04}"
        REGISTRY_MIRROR: "${REGISTRY:-}"
        APT_MIRROR: "${APT_MIRROR:-}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - REPORT_SERVER_PORT=8083
      - REPORT_DIR=/data
      - REGISTRY_IA_URSU_URL=${REGISTRY_IA_URSU_URL:-}
      - REGISTRY_IA_URSU_USER=${REGISTRY_IA_URSU_USER:-}
      - REGISTRY_IA_URSU_PASSWORD=${REGISTRY_IA_URSU_PASSWORD:-}
      - REGISTRY_IA_TEST_URL=${REGISTRY_IA_TEST_URL:-}
      - REGISTRY_IA_TEST_USER=${REGISTRY_IA_TEST_USER:-}
      - REGISTRY_IA_TEST_PASSWORD=${REGISTRY_IA_TEST_PASSWORD:-}
    volumes:
      - registry-reports:/data
    networks:
      - l2_network

networks:
  l2_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16

volumes:
  grafana-storage:
    driver: local
  perses-data:
    driver: local
  victoria-metrics-data:
    driver: local
  vmagent-data:
    driver: local
  nats-data:
    driver: local
  oracle-data:
    driver: local
  postgres-data:
    driver: local
  glitchtip-db-data:
    driver: local
  glitchtip-uploads:
    driver: local
  registry-reports:
    driver: local
