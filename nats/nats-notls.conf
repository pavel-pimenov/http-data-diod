# nats-server configuration for local runs without TLS certificates.
#
# Same base settings as nats.conf (port, JetStream store dir, 16 MiB payload)
# minus the TLS block: the production config keeps TLS enabled and expects
# server.crt/server.key mounted from certs_nats/. docker-compose selects this
# file when NATS_ENABLE_TLS is not "true".
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"
}

max_payload: 16777216
