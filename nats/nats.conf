# nats-server configuration.
#
# max_payload lives here (not on the CLI): nats-server has no --max_payload
# flag, only the config-file key. The value raises the 1 MiB stock default to
# 16 MiB because the proxy base64-encodes raw (zlib) request bodies into the
# NATS JSON envelope, so an 8 MiB body (test-port cap) becomes ~10.7 MiB plus
# JSON overhead.
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"
}

max_payload: 16777216

# TLS: always enabled. Certificate/key are mounted from certs_nats/ (read-only,
# not committed — private keys must never land in git). To run without TLS,
# comment out this block (and keep NATS_ENABLE_TLS=false in .env so clients
# don't negotiate TLS).
tls {
  cert_file: "/etc/nats/certs_nats/server.crt"
  key_file: "/etc/nats/certs_nats/server.key"
}
