; l2-db-spider конфигурация (INI).
; Монтируется в контейнер как /spider/spider-config.ini (read-only).
; Путь к файлу задаётся env DB_SPIDER_CONFIG_FILE.
;
; Общие системные SELECT-запросы вынесены в отдельные .sql-файлы в каталоге
; spider-sql/ (см. ключ sql_file). Пути в sql_file — относительно ini-файла,
; т.е. spider-sql/... монтируется рядом с конфигом в контейнер.
;
; max_rows = -1 в секциях запросов означает полный фетч без обрезания
; (l2-db-spider выгружает все записи). Задайте положительное число, чтобы
; ограничить количество строк.
;
; Пользователь/пароль каждой базы — секреты, подставляются из env через
; placeholders %DB_SPIDER_USER_<ИМЯ>% / %DB_SPIDER_PASSWORD_<ИМЯ>% (для ccm* —
; общий %DB_SPIDER_PASSWORD%).

[spider]
;interval_seconds = 300
;output_dir = /spider

; ================= Oracle: ccm2 =================
[db:ccm2]
driver = oracle
host = ccm2.nlmk
port = 1521
service = ccm2.nlmk
user = %DB_SPIDER_USER_CCM2%
password = %DB_SPIDER_PASSWORD%
pool_min = 1
pool_max = 2

