; Запросы привязываются к базе через db=<имя секции [db:...]>.
; Имя секции запроса должно быть уникальным (префикс <база>_<имя>), а реальное
; имя запроса (для файла <db>_<query>.json) задаётся через name=.
; SQL вынесен в spider-sql/<имя>.sql (sql_file) — общие для всех баз.

; ---------------- ccm2 ----------------
[query:ccm2_shared_pool]
name = shared_pool
db = ccm2
sql_file = spider-sql/shared_pool.sql
timeout_ms = 5000
max_rows = -1

[query:ccm2_tablespaces]
name = tablespaces
db = ccm2
sql_file = spider-sql/tablespaces.sql
timeout_ms = 10000
max_rows = -1

[query:ccm2_table_sizes]
name = table_sizes
db = ccm2
sql_file = spider-sql/table_sizes.sql
timeout_ms = 15000
max_rows = -1

