# variables:

image: docker-registry.dp.nlmk.com/library/ubuntu:26.04

stages:
  - deploy

.kaniko_setup: &kaniko_setup
  image:
    name: docker-registry.dp.nlmk.com/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - echo "{\"auths\":{\"$IA_URSU_DOCKER_REPO_PATH\":{\"username\":\"$IA_URSU_DOCKER_USER_RW\",\"password\":\"$IA_URSU_DOCKER_PASS_RW\"}}}" > /kaniko/.docker/config.json
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      else
        export IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi

# Deploy builds and pushes the runtime image only. Unit tests are NOT run in CI:
# they require `docker compose` (live NATS/PostgreSQL) and run on a separate
# machine (src/Dockerfile `test` stage via docker compose run / --target test).
build_docker:
  <<: *kaniko_setup
  stage: deploy
  script:
    - time /kaniko/executor
        --context $CI_PROJECT_DIR/src
        --dockerfile $CI_PROJECT_DIR/src/Dockerfile
        --target runtime
        --build-arg GIT_SHA=$CI_COMMIT_SHORT_SHA
        --skip-unused-stages=true
        --destination $IA_URSU_DOCKER_REPO_PATH/$CI_PROJECT_NAME:$IMAGE_TAG
        --destination $IA_URSU_DOCKER_REPO_PATH/$CI_PROJECT_NAME:current
        --cache=true
        --cache-repo $IA_URSU_DOCKER_REPO_PATH/$CI_PROJECT_NAME/cache
        --cache-ttl=168h
    - echo "Docker Image Tag:" "$IMAGE_TAG"
    - echo "Docker Image Name:" "$IA_URSU_DOCKER_REPO_PATH/$CI_PROJECT_NAME:$IMAGE_TAG"
    - echo "Docker Image Name:" "$IA_URSU_DOCKER_REPO_PATH/$CI_PROJECT_NAME:current"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual

# Deploys the grafana-dashboards-sync sidecar image (Dockerfile target
# grafana-sync). Separate image so the one-shot dashboard generator can be
# pulled from the registry in prod and built locally in dev. Pushed with the
# same IMAGE_TAG as runtime.
build_dashboards_sync:
  <<: *kaniko_setup
  stage: deploy
  script:
    - time /kaniko/executor
        --context $CI_PROJECT_DIR
        --dockerfile $CI_PROJECT_DIR/src/Dockerfile
        --target grafana-sync
        --skip-unused-stages=true
        --destination $IA_URSU_DOCKER_REPO_PATH/$CI_PROJECT_NAME-dashboards-sync:$IMAGE_TAG
        --destination $IA_URSU_DOCKER_REPO_PATH/$CI_PROJECT_NAME-dashboards-sync:current
        --cache=true
        --cache-repo $IA_URSU_DOCKER_REPO_PATH/$CI_PROJECT_NAME/cache
        --cache-ttl=168h
    - echo "Dashboards Sync Image Tag:" "$IMAGE_TAG"
    - echo "Dashboards Sync Image Name:" "$IA_URSU_DOCKER_REPO_PATH/$CI_PROJECT_NAME-dashboards-sync:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
