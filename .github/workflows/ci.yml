name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build + unit tests + NATS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install python deps for smoke test
        run: pip install aiohttp nats-py

      - name: Python unit tests (no network)
        run: ./scripts/ci-gate.sh unit

      - name: Offline gates (python style, metric consistency, env-var <-> compose, docker build-context)
        run: ./scripts/ci-gate.sh offline

      - name: Generate version header (as rebuild-and-run.sh)
        run: |
          mkdir -p src/build
          ./src/generate_version.sh > src/build/l2-proxy-version.h
          cp -a src/build/l2-proxy-version.h src/l2-proxy-version.h
          rm -f src/build/l2-proxy

      # GRAFANA_URL points to a dead port so rebuild-and-run.sh skips the
      # dashboard-update block and the build/health gates stay deterministic.
      # buildx docker-container driver enables the GitHub Actions cache backend;
      # rebuild-and-run.sh then builds via `docker buildx bake` (L2_BAKE_CACHE=gha)
      # so layers produced on this run warm the next CI run.
      - name: Set up Buildx with GitHub Actions cache
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build images and start the stack
        run: GRAFANA_URL=http://127.0.0.1:65530 L2_BAKE_CACHE=gha ./rebuild-and-run.sh

      # Message counter, DB Gateway e2e, golden metrics (--traffic --db) and
      # /metrics consistency — the same single source of truth as pre-commit.
      - name: Runtime gates (smoke + DB e2e + golden + metrics consistency)
        run: ./scripts/ci-gate.sh runtime

      # Shell hygiene over all .sh files (runs in the builder image, whose
      # layers are already cached by the bake step above).
      - name: Shellcheck all shell scripts
        run: bash scripts/run-shellcheck.sh --all

      - name: NATS reconnect + dedup e2e test
        run: python3 scripts/e2e-worker-reconnect-test.py

      - name: Collect docker logs on failure
        if: failure()
        run: docker compose logs --no-color > /tmp/compose-logs.txt || true

      - name: Upload docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/compose-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans

  coverage:
    name: Coverage gate (lines >= 90%, branch >= 40%, per-file regression)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Render coverage report (line/branch gates + per-file regression)
        run: bash scripts/run-coverage.sh "$GITHUB_WORKSPACE/coverage-report"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

  clang-tidy:
    name: clang-tidy (full sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builder image contains clang-tidy + NATS headers; errors in project
      # files fail the job, pre-existing style warnings are non-blocking.
      - name: Run clang-tidy over all project C++ files
        run: bash scripts/run-clang-tidy.sh --all