name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build + unit tests + NATS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install python deps for smoke test
        run: pip install aiohttp

      - name: Generate version header (as rebuild-and-run.sh)
        run: |
          mkdir -p cpp/l2-proxy/build
          ./cpp/l2-proxy/generate_version.sh > cpp/l2-proxy/build/l2-proxy-version.h
          cp -a cpp/l2-proxy/build/l2-proxy-version.h cpp/l2-proxy/l2-proxy-version.h
          rm -f cpp/l2-proxy/build/l2-proxy

      # GRAFANA_URL points to a dead port so rebuild-and-run.sh skips the
      # dashboard-update block and the build/health gates stay deterministic.
      - name: Build images and start the stack
        run: GRAFANA_URL=http://127.0.0.1:65530 ./rebuild-and-run.sh

      - name: Smoke test (NATS, 1 iteration)
        run: python3 message_counter.py --iterations 1 --concurrent 1 --dup-check

      - name: Golden metrics check (full catalogue + traffic counters)
        run: python3 scripts/metrics-golden-check.py --traffic

      - name: Collect docker logs on failure
        if: failure()
        run: docker compose logs --no-color > /tmp/compose-logs.txt || true

      - name: Upload docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/compose-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans

  coverage:
    name: Coverage gate (>= 90% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Render coverage report (fails below the 90% gate)
        run: bash scripts/run-coverage.sh "$GITHUB_WORKSPACE/coverage-report"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

  clang-tidy:
    name: clang-tidy (full sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builder image contains clang-tidy + NATS headers; errors in project
      # files fail the job, pre-existing style warnings are non-blocking.
      - name: Run clang-tidy over all project C++ files
        run: bash scripts/run-clang-tidy.sh --all