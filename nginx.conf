events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
    #    debug_connection 172.24.138.38;   # IP клиента, генерящего ошибку
    # Можно включить отладку соединений по IP, если nginx собран с debug — раскомментируйте:
    # debug_connection 127.0.0.1;
}

http {
    # Disable request buffering to reduce I/O overhead
    proxy_request_buffering off;
    
    # Increase buffer sizes to handle larger payloads in memory
    client_body_buffer_size 2m;
    client_max_body_size 10m;
    
    resolver 127.0.0.11 ipv6=off;
    # Уровень логирования ошибок: warn (подавляет info логи, такие как закрытие keepalive соединений)
    # Для Docker лучше писать в stderr
    error_log /dev/stderr warn;
    
    # Можно включить ниже стандартный вывод ошибки в файл:
    # error_log /var/log/nginx/error.log debug;

    # Формат access_log уже довольно подробный, добавим логирование всех переменных (если нужно больше подробностей)

    log_format upstream_log '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for" '
                            'upstream: $upstream_addr';
#  'us_cl="$upstream_http_content_length" '
#  'us_te="$upstream_http_transfer_encoding" '
#  'us_ct="$upstream_http_content_type" '
 
#    log_format upstream_dbg '$remote_addr - $request_id - $time_local "$request" $status $body_bytes_sent '
#  'upstream=$upstream_addr us_status=$upstream_status '
#  'req_time=$request_time us_time=$upstream_response_time '
#  'us_cl="$upstream_http_content_length" '
#  'us_te="$upstream_http_transfer_encoding" '
#  'us_ct="$upstream_http_content_type" '
#  'ref="$http_referer" ua="$http_user_agent"';

    # access_log /var/log/nginx/access.log upstream_log;
    # Дополнительно можно добавить access_log для отладки прямо в stderr (удобно для Docker):
    access_log /dev/stderr upstream_log;

    # Increase limits for handling high concurrent connections
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_body_timeout 300s;
    client_header_timeout 60s;
    keepalive_timeout 65;
    keepalive_requests 1000;
    send_timeout 300s;

    upstream proxy_backend {
        zone proxy_backend 2m;
        server l2-proxy:8888 resolve;
        keepalive 64;
    }

    server {
        listen 80 backlog=2048;

        location ~ ^/(DataHub/DataHubSrv|GantPool/GetGantDescr)$ {
           proxy_buffering on;
           proxy_buffers 16 256k;
           proxy_buffer_size 128k;
           proxy_max_temp_file_size 0;  # не писать во временный файл
           proxy_read_timeout 300s; # Increased for longer operations
           proxy_connect_timeout 30s;
           proxy_send_timeout 300s;
           proxy_pass http://proxy_backend;
#           proxy_ssl_verify off;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_http_version 1.1;
           proxy_set_header Connection "";
        }

        # Health check endpoint for nginx
        location = /nginx-health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://proxy_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        location /metrics {
            stub_status;
            allow 127.0.0.1;
            allow ::1;
            allow 172.28.0.0/16;  # Allow from docker network
            allow 172.22.0.0/16;  # Allow from docker network
            deny all;
        }
    }
}
