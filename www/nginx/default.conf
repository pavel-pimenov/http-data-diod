# HTTP-блок: нужен только для docker-healthcheck (busybox wget не умеет TLS).
# Наружу проброшен только порт 443 (HTTPS); 80 не публикуется.
server {
    listen 80;
    listen [::]:80;
    server_name nl-sp-p3pg-ad1;
    root  /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nl-sp-p3pg-ad1;

    ssl_certificate     /etc/nginx/ssl/hub.crt;
    ssl_certificate_key /etc/nginx/ssl/hub.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
