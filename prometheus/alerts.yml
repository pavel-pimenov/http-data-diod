groups:
  - name: l2_availability
    interval: 30s
    rules:
      - alert: L2NATSDown
        expr: |
          (
            l2_proxy_nats_connected{vm=~".+"} == 0
            or
            l2_worker_nats_connected{vm=~".+"} == 0
          )
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NATS connectivity lost (vm={{ $labels.vm }}, job={{ $labels.job }})"
          description: "l2_*_nats_connected == 0 for >1m. Check nats-server (docker compose ps, healthz) and NATS reconnect logs."

      - alert: L2NotReady
        expr: |
          (
            l2_proxy_health_ready{vm=~".+"} == 0
            or
            l2_worker_health_ready{vm=~".+"} == 0
            or
            l2_server_health_ready{vm=~".+"} == 0
          )
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service not ready (vm={{ $labels.vm }})"
          description: "health_ready == 0 for >1m. Check /health/ready and is_connected()."

  - name: l2_error_rate
    interval: 30s
    rules:
      - alert: L2HighErrorRate
        expr: |
          (
            sum by (vm) (rate(l2_proxy_responses_total{status=~"4..|5..",vm=~".+"}[5m]))
            /
            clamp_min(sum by (vm) (rate(l2_proxy_responses_total{vm=~".+"}[5m])), 0.0001)
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on l2-proxy (vm={{ $labels.vm }}) >5% for 2m"
          description: "error_rate = 4xx+5xx / total. Check l2-proxy/worker logs and status codes panel."

      - alert: L2CriticalErrorRate
        expr: |
          (
            sum by (vm) (rate(l2_proxy_responses_total{status=~"5..",vm=~".+"}[5m]))
            /
            clamp_min(sum by (vm) (rate(l2_proxy_responses_total{vm=~".+"}[5m])), 0.0001)
          ) > 0.20
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical 5xx rate on l2-proxy (vm={{ $labels.vm }}) >20%"
          description: "5xx rate >20% for 1m. Check L2 server (http://l2-server:8088) and worker circuit breaker."

  - name: l2_saturation
    interval: 30s
    rules:
      - alert: L2WorkerQueueSaturation
        expr: |
          l2_worker_queue_size{vm=~".+"} > 50
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Worker queue saturated (vm={{ $labels.vm }})"
          description: "queue_size >50 for 1m. Check ThreadPoolWrapper queue, in_flight, and DB pool. Early backpressure signal."

      - alert: L2ProxyInFlightHigh
        expr: |
          l2_proxy_in_flight_requests{vm=~".+"} > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Proxy in-flight high (vm={{ $labels.vm }})"
          description: "in_flight >100 for 2m. Check NATS latency and L2 latency."

      - alert: L2PerIPRateLimitHigh
        expr: |
          rate(l2_per_ip_rate_limiter_rejected_total{vm=~".+"}[1m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Per-IP rate limiting high (vm={{ $labels.vm }})"
          description: "rejected >10/s for 2m. Check hot clients panel (X-DataHub-Client-Id) and adjust PER_IP_MAX_TOKENS."
